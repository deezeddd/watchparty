<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: #141414;
      color: #e8e8e8;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
    }
    h1 { font-size: 15px; margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #9a9a9a; margin: 10px 0 3px; }
    input {
      width: 100%;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0f0f0f;
      color: #e8e8e8;
      padding: 7px 9px;
      font-size: 12px;
    }
    input:focus { outline: 1px solid #e50914; }
    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 6px;
      padding: 9px;
      background: #e50914;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #f6121d; }
    button.secondary { background: #2e2e2e; font-weight: 400; }
    #status { margin-top: 10px; font-size: 12px; color: #9a9a9a; word-break: break-all; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>🎬 WatchParty</h1>

  <label for="name">Your name</label>
  <input id="name" placeholder="e.g. Vedant" maxlength="40">

  <label for="server">Signaling server</label>
  <input id="server" placeholder="ws://localhost:8787">

  <button id="start">Start party on this tab</button>
  <button id="leave" class="secondary hidden">Leave party</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
